[General]
; XButton1 = tablet/mouse "4th click" / Back   (rear button: zoom / pan)
; XButton2 = tablet/mouse "5th click" / Forward (front button: undo / sample)
Trigger=XButton1
SampleTrigger=XButton2

; 1 = only while Krita is focused (recommended)
OnlyKrita=1

; click-hold action: zoom or pan  (double-hold is the other one)
; You can also swap this from the tray icon.
ClickHold=zoom

; Window (ms) after a short tap in which a second click counts as double-hold.
; Click-hold starts instantly; this only affects double-click detection.
DoubleClickMs=280

; How long (ms) the front button must be held before it samples colour.
; A shorter press is Undo (Ctrl+Z).
SampleHoldMs=180

; 1 = brief ZOOM / PAN / UNDO / SAMPLE tooltip when a mode starts
ShowHint=1
